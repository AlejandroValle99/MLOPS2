# Every hook runs the tool from the project's own environment (uv.lock), so a commit checks
# exactly what `uv run ruff`, `uv run mypy` and `uv run pytest` check by hand: same
# versions, same installed libraries. Install once with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]

      # Fixed targets, not the staged files: the same command as CLAUDE.md and the README.
      - id: mypy
        name: mypy (model, stroke, api, services, stroke_rpc)
        entry: uv run --group api --group ml --group serve --group stream mypy model stroke api services stroke_rpc
        language: system
        types: [python]
        pass_filenames: false

      # The suite needs no services and runs in about a second; only on Python changes.
      - id: pytest
        name: pytest
        entry: uv run --group api --group ml --group serve --group stream --group dev pytest -q
        language: system
        types: [python]
        pass_filenames: false
