# ─── shared Airflow config ────────────────────────────────────────────────────
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    # MLflow & MinIO access for training tasks
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    # Immutable raw file. stroke_pipeline.py's train_model task overrides this at
    # runtime to point at the fetched snapshot instead — see that DAG's comments.
    DATA_PATH: /opt/airflow/data/raw/healthcare-dataset-stroke-data.csv
    # How the retrain DAG's snapshot differs from the raw file: the share of rows it keeps
    # and the noise it adds. fetch_data builds it from the raw zone in MinIO.
    MUTATION_SAMPLE_RATE: "${MUTATION_SAMPLE_RATE:-0.80}"
    MUTATION_NOISE_STD: "${MUTATION_NOISE_STD:-0.03}"
    # Training registers versions under the same name the model server follows, and the
    # gate's default bar (each DAG run can override it in "Trigger DAG w/ config").
    MODEL_NAME: ${MODEL_NAME}
    GATE_MIN_P_BETTER: "${GATE_MIN_P_BETTER:-0.90}"
    PYTHONPATH: /opt/airflow:/opt/airflow/dags
  volumes:
    - ./dags:/opt/airflow/dags
    - ./model:/opt/airflow/model
    - ./stroke:/opt/airflow/stroke
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  networks: [backend]
  depends_on:
    postgres:
      condition: service_healthy
    mlflow:
      condition: service_healthy

# ─── networks ─────────────────────────────────────────────────────────────────
# Three networks, so each service reaches only what it needs. The api, the one service
# facing the internet, is on `scoring` alone: it can reach the model server and nothing
# else, so even a compromised api can't read MinIO or move an alias in MLflow (which has
# no authentication of its own here). Only the model server joins `scoring` to `backend`.
networks:
  backend: {} # postgres, minio, mlflow, airflow, model-init, model-server, lake-sink
  scoring: {} # model-server and its clients: api, stream-worker
  stream: {} # redpanda and its clients: stream-worker, lake-sink

# ─── secrets ──────────────────────────────────────────────────────────────────
# The TLS files from ./scripts/make_certs.sh, each mounted (read-only, under /run/secrets/)
# only into the services that use it. Run that script once before the first `up`.
secrets:
  grpc-ca:
    file: ./certs/ca.crt
  grpc-server-cert:
    file: ./certs/server.crt
  grpc-server-key:
    file: ./certs/server.key

# ─── services ─────────────────────────────────────────────────────────────────
# Published ports are bound to 127.0.0.1 (this machine only), except the api's.
services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15.19
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [backend]
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO ───────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [backend]
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # MinIO Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ── MinIO bucket initialisation ─────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    volumes:
      # Only the raw/ zone, not all of ./data — mc cp mirrors the mounted path's
      # structure, and a flat key (local/datasets/healthcare-dataset-stroke-data.csv)
      # is what model-init's DATA_PATH and the api's DATASET_KEY both expect.
      - ./data/raw:/data
    networks: [backend]
    command:
      - -c
      - |
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
        mc mb --ignore-existing local/mlflow-artifacts
        mc mb --ignore-existing local/datasets
        mc mb --ignore-existing local/lake
        mc cp --recursive /data/ local/datasets/
    restart: "no"

  # ── MLflow tracking server ──────────────────────────────────────────────────
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow_db
      MLFLOW_ARTIFACT_ROOT: s3://mlflow-artifacts/
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    networks: [backend]
    ports:
      - "127.0.0.1:5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Airflow DB init + admin user ────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # ${AIRFLOW_ADMIN_USER}/${AIRFLOW_ADMIN_PASSWORD} are substituted by Compose itself
    # from .env at parse time (same mechanism as ${POSTGRES_USER} above) — this is NOT
    # a container env var, so it doesn't need touching airflow-common's environment block.
    # Bug fixed here: this used to hardcode --username admin --password admin.
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@mlops.local || true
    restart: "no"

  # ── Airflow webserver ────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Airflow scheduler ───────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # The first champion: trains every candidate (few trials, so the first start stays short)
  # and sends the finalist through the same gate as the DAGs. Exits at once if a champion
  # already exists. Reads the raw file and its manifest from a read-only mount. Its image
  # also holds scripts/, for operator commands that need MLflow and MinIO:
  #   docker compose run --rm model-init python -m scripts.record_artifact_digests
  model-init:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MODEL_NAME: ${MODEL_NAME}
      DATA_PATH: /app/data/raw/healthcare-dataset-stroke-data.csv
    volumes:
      - ./data/raw:/app/data/raw:ro
    networks: [backend]
    command: python -m model.train --skip-if-champion --trials 10
    depends_on:
      mlflow:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  # ── gRPC model server ───────────────────────────────────────────────────────
  # Holds the champion model and hot-reloads it when the alias moves. The API and the
  # stream worker score through it, so there is one model in memory for every client.
  # The only service that loads model files, so the only one besides training that holds
  # the registry and storage credentials. TLS only; every call but health needs a key.
  model-server:
    build:
      context: .
      dockerfile: services/model_server/Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MODEL_NAME: ${MODEL_NAME}
      MODEL_ALIAS: ${MODEL_ALIAS}
      RELOAD_INTERVAL_S: "${RELOAD_INTERVAL_S:-10}"
      GRPC_MAX_WORKERS: "${GRPC_MAX_WORKERS:-8}"
      GRPC_MAX_CONCURRENT_RPCS: "${GRPC_MAX_CONCURRENT_RPCS:-32}"
      # One key per client, so either can be revoked alone
      MODEL_SERVER_KEYS: "${MODEL_SERVER_KEY_API},${MODEL_SERVER_KEY_WORKER}"
      TLS_CERT_FILE: /run/secrets/grpc-server-cert
      TLS_KEY_FILE: /run/secrets/grpc-server-key
      TLS_CA_FILE: /run/secrets/grpc-ca # for the healthcheck, a client like any other
    secrets: [grpc-ca, grpc-server-cert, grpc-server-key]
    networks: [backend, scoring]
    ports:
      - "127.0.0.1:50051:50051" # grpcurl/grpcui from this machine only
    healthcheck:
      # SERVING only once a model is loaded, so the API waits for a usable model server
      test: ["CMD", "python", "-m", "services.model_server.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      mlflow:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully # a champion exists before we start
    restart: unless-stopped

  # ── FastAPI serving ─────────────────────────────────────────────────────────
  # The public edge. It holds no data credentials and reaches nothing but the model server
  # (the `scoring` network): no dataset, no model files, no registry.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Set: the API scores through the model server. Unset: it loads the model itself.
      MODEL_SERVER_TARGET: model-server:50051
      RPC_TIMEOUT_S: "${RPC_TIMEOUT_S:-2}"
      UPSTREAM_API_KEY: ${MODEL_SERVER_KEY_API}
      TLS_CA_FILE: /run/secrets/grpc-ca
      # Signs and checks the callers' tokens; also the audit log's fingerprint key. Both at
      # least 32 bytes, or the API refuses to start.
      JWT_SECRET: ${JWT_SECRET}
      AUDIT_KEY: ${AUDIT_KEY}
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-60}"
    secrets: [grpc-ca]
    networks: [scoring]
    ports:
      - "8000:8000"
    depends_on:
      model-server:
        condition: service_healthy
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v26.2.3
    profiles: ["streaming"]
    # Two listeners: containers reach the broker as redpanda:9092, the laptop (the event
    # producer, the hospital inbox) as localhost:19092. A Kafka client reconnects to the
    # address the broker advertises, so each side must be told its own.
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --default-log-level=warn
    networks: [stream]
    # Both loopbacks: on macOS `localhost` resolves to ::1 first, and kafka-python reaches
    # the advertised localhost:19092 only through the first address it resolves.
    ports:
      - "127.0.0.1:19092:19092"
      - "[::1]:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test:
        ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Creates the topics, or leaves them if they exist, then sets the one-hour retention on
  # the two that hold patient features. The retention is set even on existing topics:
  # dev-container mode auto-creates a topic on first use, with the default retention.
  redpanda-init:
    image: redpandadata/redpanda:v26.2.3
    profiles: ["streaming"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        create() {
          rpk topic create "$$1" -p 1 -r 1 -X brokers=redpanda:9092 "$${@:2}" \
            || rpk topic describe "$$1" -X brokers=redpanda:9092 > /dev/null
        }
        create patient-events
        create patient-events-dlq
        create predictions
        create drift-alerts
        create window-reports
        rpk topic alter-config patient-events patient-events-dlq \
          --set retention.ms=3600000 -X brokers=redpanda:9092
    networks: [stream]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  stream-worker:
    build:
      context: .
      dockerfile: services/stream_worker/Dockerfile
    profiles: ["streaming"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      MODEL_SERVER_TARGET: model-server:50051
      RPC_TIMEOUT_S: "${RPC_TIMEOUT_S:-2}"
      WINDOW_EVENTS: "${WINDOW_EVENTS:-300}"
      UPSTREAM_API_KEY: ${MODEL_SERVER_KEY_WORKER}
      TLS_CA_FILE: /run/secrets/grpc-ca
    secrets: [grpc-ca]
    networks: [scoring, stream]
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      model-server:
        condition: service_healthy
    restart: unless-stopped

  # Archives the stream's results in the lake bucket: predictions and window reports, as
  # Parquet, one folder per day. Apart from the worker, so the worker holds no storage
  # credentials, and a slow or broken MinIO never delays a hospital's scores.
  lake-sink:
    build:
      context: .
      dockerfile: services/lake_sink/Dockerfile
    profiles: ["streaming"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # boto3 reads these itself. Without AWS_ENDPOINT_URL_S3, and with AWS credentials,
      # the same code writes to AWS S3 instead of MinIO.
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      LAKE_BUCKET: lake
      LAKE_BLOCK_RECORDS: "${LAKE_BLOCK_RECORDS:-1000}"
      LAKE_FLUSH_S: "${LAKE_FLUSH_S:-30}"
    networks: [stream, backend]
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

# ─── volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  minio-data:
  airflow-logs:
  redpanda-data:
