# ─── shared Airflow config ────────────────────────────────────────────────────
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    # MLflow & MinIO access for training tasks
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    # Immutable raw file. stroke_pipeline.py's train_model task overrides this at
    # runtime to point at the fetched snapshot instead — see that DAG's comments.
    DATA_PATH: /opt/airflow/data/raw/healthcare-dataset-stroke-data.csv
    DATA_SERVICE_URL: http://api:8000
    PYTHONPATH: /opt/airflow:/opt/airflow/dags
  volumes:
    - ./dags:/opt/airflow/dags
    - ./model:/opt/airflow/model
    - ./stroke:/opt/airflow/stroke
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    mlflow:
      condition: service_healthy

# ─── services ─────────────────────────────────────────────────────────────────
services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO ───────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ── MinIO bucket initialisation ─────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    volumes:
      # Only the raw/ zone, not all of ./data — mc cp mirrors the mounted path's
      # structure, and a flat key (local/datasets/healthcare-dataset-stroke-data.csv)
      # is what model-init's DATA_PATH and the api's DATASET_KEY both expect.
      - ./data/raw:/data
    command:
      - -c
      - |
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
        mc mb --ignore-existing local/mlflow-artifacts
        mc mb --ignore-existing local/datasets
        mc cp --recursive /data/ local/datasets/
    restart: "no"

  # ── MLflow tracking server ──────────────────────────────────────────────────
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow_db
      MLFLOW_ARTIFACT_ROOT: s3://mlflow-artifacts/
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Airflow DB init + admin user ────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # ${AIRFLOW_ADMIN_USER}/${AIRFLOW_ADMIN_PASSWORD} are substituted by Compose itself
    # from .env at parse time (same mechanism as ${POSTGRES_USER} above) — this is NOT
    # a container env var, so it doesn't need touching airflow-common's environment block.
    # Bug fixed here: this used to hardcode --username admin --password admin.
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@mlops.local || true
    restart: "no"

  # ── Airflow webserver ────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Airflow scheduler ───────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  model-init:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      DATA_PATH: s3://datasets/healthcare-dataset-stroke-data.csv
    command: python -m model.train
    depends_on:
      mlflow:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  # ── gRPC model server ───────────────────────────────────────────────────────
  # Holds the champion model and hot-reloads it when the alias moves. The API and the
  # stream worker score through it, so there is one model in memory for every client.
  model-server:
    build:
      context: .
      dockerfile: services/model_server/Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MODEL_NAME: ${MODEL_NAME}
      MODEL_ALIAS: ${MODEL_ALIAS}
      RELOAD_INTERVAL_S: "${RELOAD_INTERVAL_S:-10}"
      GRPC_MAX_WORKERS: "${GRPC_MAX_WORKERS:-8}"
      GRPC_MAX_CONCURRENT_RPCS: "${GRPC_MAX_CONCURRENT_RPCS:-32}"
    ports:
      - "50051:50051"
    healthcheck:
      # SERVING only once a model is loaded, so the API waits for a usable model server
      test: ["CMD", "python", "-m", "services.model_server.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      mlflow:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully # a champion exists before we start
    restart: unless-stopped

  # ── FastAPI serving ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Set: the API scores through the model server. Unset: it loads the model itself.
      MODEL_SERVER_TARGET: model-server:50051
      RPC_TIMEOUT_S: "${RPC_TIMEOUT_S:-2}"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MODEL_NAME: ${MODEL_NAME}
      MODEL_ALIAS: ${MODEL_ALIAS}
      DATASET_BUCKET: datasets
      DATASET_KEY: healthcare-dataset-stroke-data.csv
      MUTATION_SAMPLE_RATE: ${MUTATION_SAMPLE_RATE}
      MUTATION_NOISE_STD: ${MUTATION_NOISE_STD}
      API_KEYS: ${API_KEYS}
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
      model-server:
        condition: service_healthy
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v26.2.3
    profiles: ["streaming"]
    # Two listeners: containers reach the broker as redpanda:9092, the laptop (the event
    # producer, the hospital inbox) as localhost:19092. A Kafka client reconnects to the
    # address the broker advertises, so each side must be told its own.
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --default-log-level=warn
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test:
        ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Creates the topics, or leaves them if they exist, then sets the one-hour retention on
  # the two that hold patient features. The retention is set even on existing topics:
  # dev-container mode auto-creates a topic on first use, with the default retention.
  redpanda-init:
    image: redpandadata/redpanda:v26.2.3
    profiles: ["streaming"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        create() {
          rpk topic create "$$1" -p 1 -r 1 -X brokers=redpanda:9092 "$${@:2}" \
            || rpk topic describe "$$1" -X brokers=redpanda:9092 > /dev/null
        }
        create patient-events
        create patient-events-dlq
        create predictions
        create drift-alerts
        rpk topic alter-config patient-events patient-events-dlq \
          --set retention.ms=3600000 -X brokers=redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  stream-worker:
    build:
      context: .
      dockerfile: services/stream_worker/Dockerfile
    profiles: ["streaming"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      MODEL_SERVER_TARGET: model-server:50051
      RPC_TIMEOUT_S: "${RPC_TIMEOUT_S:-2}"
      WINDOW_EVENTS: "${WINDOW_EVENTS:-300}"
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      model-server:
        condition: service_healthy
    restart: unless-stopped

# ─── volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  minio-data:
  airflow-logs:
  redpanda-data:
