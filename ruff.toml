target-version = "py312"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
unfixable = ["F401"]  # flag unused imports, but never auto-delete them

[format]
quote-style = "double"
indent-style = "space"
