<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System with REST</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --soft: #ecebe5; --fg: #1d2127; --muted: #5d646d;
    --line: #8d949c; --accent: #c2410c; --accent-soft: #fdede3;
    --err: #b42318; --err-soft: #fdecea; --ok: #17803d; --ok-soft: #e7f4ea;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141619; --panel: #1d2024; --soft: #262a30; --fg: #e7e9ec; --muted: #9ba3ad;
      --line: #6b737d; --accent: #fb8c4a; --accent-soft: #3b2417;
      --err: #f47a6e; --err-soft: #3a1f1d; --ok: #5fd18a; --ok-soft: #173223;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141619; --panel: #1d2024; --soft: #262a30; --fg: #e7e9ec; --muted: #9ba3ad;
    --line: #6b737d; --accent: #fb8c4a; --accent-soft: #3b2417;
    --err: #f47a6e; --err-soft: #3a1f1d; --ok: #5fd18a; --ok-soft: #173223;
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); }
  main { max-width: 1160px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  figure { margin: 0 0 36px; }
  .scroll { overflow-x: auto; }
  figcaption { color: var(--muted); font-size: 14px; margin-top: 10px; max-width: 90ch; }
  svg { display: block; width: 100%; min-width: 920px; height: auto; }
  svg text { font-family: var(--sans); font-size: 12px; fill: var(--fg); }
  svg .t { font-size: 14px; font-weight: 600; }
  svg .m { font-size: 11.5px; fill: var(--muted); }
  svg .c { font-family: var(--mono); font-size: 11.5px; white-space: pre; }
  svg .h { font-size: 11px; font-weight: 600; letter-spacing: .08em; fill: var(--muted); }
  svg .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
  svg .group { fill: var(--soft); stroke: var(--line); stroke-width: 1; }
  svg .hl { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.8; }
  svg .hl-text { fill: var(--accent); }
  svg .e { fill: none; stroke: var(--fg); stroke-width: 1.3; }
  svg .e-hl { fill: none; stroke: var(--accent); stroke-width: 2.2; }
  svg .ah { fill: var(--fg); }
  svg .ah-hl { fill: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>System with REST</h1>
  <p class="sub">Every service in docker-compose.yml when the REST API holds the model itself.</p>

  <figure>
    <div class="scroll">
    <svg viewBox="0 0 1120 728" role="img" aria-label="Airflow and model-init train models and register them in MLflow, which keeps metadata in PostgreSQL and model files in MinIO. The FastAPI service loads the @champion model into its own memory once, at startup, and serves predictions to clients.">
      <defs>
        <marker id="s1-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
        <marker id="s1-h" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-hl"/></marker>
      </defs>

      <!-- lane headers -->
      <text class="h" x="20" y="28">TRAINING</text>
      <text class="h" x="420" y="28">REGISTRY &amp; STORAGE</text>
      <text class="h" x="820" y="28">SERVING</text>

      <!-- ── Training lane ─────────────────────────────────────────── -->
      <rect class="group" x="20" y="150" width="300" height="352" rx="10"/>
      <text class="t" x="36" y="174">Airflow</text>
      <text class="m" x="304" y="174" text-anchor="end">scheduler · webserver :8080</text>

      <rect class="box" x="36" y="190" width="268" height="48" rx="6"/>
      <text class="c" x="48" y="210">stroke_prediction_pipeline</text>
      <text class="m" x="48" y="228">pulls /dataset → validates → retrains</text>

      <rect class="box" x="36" y="262" width="268" height="48" rx="6"/>
      <text class="c" x="48" y="282">0_stroke_full_pipeline</text>
      <text class="m" x="48" y="300">orchestrator: runs the two below in order</text>

      <line class="e" x1="170" y1="310" x2="170" y2="334" marker-end="url(#s1-a)"/>
      <text class="m" x="180" y="327">triggers</text>

      <rect class="box" x="36" y="336" width="268" height="48" rx="6"/>
      <text class="c" x="48" y="356">stroke_data_cleaning</text>
      <text class="m" x="48" y="374">60 / 20 / 20 train · val · test splits</text>

      <line class="e" x1="170" y1="384" x2="170" y2="436" marker-end="url(#s1-a)"/>
      <text class="m" x="180" y="414">then</text>

      <rect class="box" x="36" y="438" width="268" height="48" rx="6"/>
      <text class="c" x="48" y="458">etl_train_models_process_taskflow</text>
      <text class="m" x="48" y="476">5 models · Optuna · best F2 → @champion</text>

      <rect class="box" x="20" y="530" width="300" height="64" rx="8"/>
      <text class="t" x="36" y="554">model-init</text>
      <text class="m" x="304" y="554" text-anchor="end">one-shot, at stack start</text>
      <text class="c" x="36" y="578">python -m model.train</text>

      <!-- ── Registry & storage lane ───────────────────────────────── -->
      <rect class="group" x="420" y="150" width="300" height="264" rx="10"/>
      <text class="t" x="436" y="174">MinIO</text>
      <text class="m" x="704" y="174" text-anchor="end">S3 API :9000 · console :9001</text>

      <rect class="box" x="436" y="190" width="268" height="64" rx="6"/>
      <text class="c" x="448" y="210">datasets/</text>
      <text class="m" x="448" y="228">healthcare-dataset-stroke-data.csv</text>
      <text class="m" x="448" y="244">raw, immutable · seeded by minio-init</text>

      <rect class="box" x="436" y="330" width="268" height="64" rx="6"/>
      <text class="c" x="448" y="350">mlflow-artifacts/</text>
      <text class="m" x="448" y="368">model files of every run</text>
      <text class="m" x="448" y="384">processed/final/ — the splits</text>

      <rect class="box" x="420" y="444" width="300" height="156" rx="10"/>
      <text class="t" x="436" y="468">MLflow</text>
      <text class="m" x="704" y="468" text-anchor="end">tracking + model registry :5001</text>
      <rect class="hl" x="436" y="482" width="268" height="34" rx="17"/>
      <text class="c hl-text" x="570" y="504" text-anchor="middle" font-weight="600">stroke-model @champion</text>
      <text class="m" x="436" y="542">every run: params, metrics, model</text>
      <text class="m" x="436" y="560">versions tagged model_family, data_version</text>
      <text class="m" x="436" y="578">the alias decides which version is served</text>

      <rect class="box" x="420" y="640" width="300" height="72" rx="8"/>
      <text class="t" x="436" y="664">PostgreSQL</text>
      <text class="m" x="704" y="664" text-anchor="end">:5432</text>
      <text class="m" x="436" y="684">airflow_db — Airflow's own metadata</text>
      <text class="m" x="436" y="702">mlflow_db — runs, registry, aliases</text>

      <!-- MLflow → MinIO, MLflow → PostgreSQL -->
      <line class="e" x1="570" y1="444" x2="570" y2="396" marker-end="url(#s1-a)"/>
      <text class="m" x="580" y="434">model files</text>
      <line class="e" x1="570" y1="600" x2="570" y2="638" marker-end="url(#s1-a)"/>
      <text class="m" x="580" y="624">metadata</text>

      <!-- training → storage -->
      <path class="e" d="M304,360 H434" marker-end="url(#s1-a)"/>
      <text class="m" x="370" y="352" text-anchor="middle">splits</text>
      <path class="e" d="M304,462 H418" marker-end="url(#s1-a)"/>
      <text class="m" x="370" y="440" text-anchor="middle">logs runs,</text>
      <text class="m" x="370" y="454" text-anchor="middle">sets @champion</text>
      <path class="e" d="M320,562 H418" marker-end="url(#s1-a)"/>
      <text class="m" x="370" y="540" text-anchor="middle">first version,</text>
      <text class="m" x="370" y="554" text-anchor="middle">sets @champion</text>

      <!-- ── Serving lane ──────────────────────────────────────────── -->
      <rect class="box" x="900" y="56" width="200" height="56" rx="8"/>
      <text class="t" x="916" y="80">Client</text>
      <text class="m" x="916" y="98">curl · mini_tp1_client.py</text>
      <line class="e" x1="1000" y1="112" x2="1000" y2="158" marker-end="url(#s1-a)"/>
      <text class="m" x="990" y="132" text-anchor="end">POST /v1/predict</text>
      <text class="m" x="990" y="146" text-anchor="end">+ X-API-KEY</text>

      <!-- DAG → API /dataset -->
      <path class="e" d="M304,214 H345 V128 H860 V158" marker-end="url(#s1-a)"/>
      <text class="m" x="600" y="120" text-anchor="middle">GET /dataset — a mutated sample to retrain on</text>

      <rect class="group" x="820" y="160" width="280" height="400" rx="10"/>
      <text class="t" x="836" y="184">FastAPI</text>
      <text class="m" x="1084" y="184" text-anchor="end">uvicorn :8000</text>
      <text class="h" x="836" y="206">ROUTES</text>
      <text class="c" x="836" y="226">GET  /dataset</text>
      <text class="m" x="962" y="226">CSV for retraining</text>
      <text class="c" x="836" y="252">POST /v1/predict</text>
      <text class="m" x="962" y="252">score · needs key</text>
      <text class="c" x="836" y="278">GET  /v1/model</text>
      <text class="m" x="962" y="278">model info · key</text>
      <text class="c" x="836" y="304">GET  /ready</text>
      <text class="m" x="962" y="304">503 until loaded</text>
      <text class="c" x="836" y="330">GET  /health</text>
      <text class="m" x="962" y="330">liveness</text>

      <!-- API → MinIO datasets -->
      <path class="e" d="M820,222 H706" marker-end="url(#s1-a)"/>
      <text class="m" x="770" y="200" text-anchor="middle">reads CSV</text>
      <text class="m" x="770" y="214" text-anchor="middle">for /dataset</text>

      <text class="h" x="836" y="372">AT STARTUP</text>
      <text class="m" x="836" y="392">lifespan() loads @champion from MLflow.</text>
      <text class="m" x="836" y="408">If that fails, the API starts anyway,</text>
      <text class="m" x="836" y="424">with no model: /ready answers 503.</text>

      <rect class="hl" x="836" y="472" width="248" height="64" rx="8"/>
      <text class="t hl-text" x="848" y="494">LocalPredictor</text>
      <text class="m" x="848" y="512">the champion, held in memory</text>
      <text class="m" x="848" y="528">loaded once, at startup</text>

      <!-- API → MLflow: the served model -->
      <path class="e-hl" d="M836,504 H724" marker-end="url(#s1-h)"/>
      <text class="hl-text" x="778" y="478" text-anchor="middle">loads</text>
      <text class="hl-text" x="778" y="492" text-anchor="middle">@champion</text>
    </svg>
    </div>
    <figcaption>
      Arrows point from the caller to what it calls. Highlighted: how the served model reaches
      users. The comparison DAG (or model-init, on the very first start) sets the
      <code>@champion</code> alias in MLflow, and the API loads that version into its own memory
      once, at startup. MLflow keeps the metadata in PostgreSQL and the model files in MinIO, so
      that load reads both. A newer champion is only served after the API restarts.
    </figcaption>
  </figure>
</main>
</body>
</html>
